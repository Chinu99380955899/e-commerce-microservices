spring.application.name=catalog-service
server.port=8082

# Database: the catalog_db created by infra/docker-compose.yml.
# The password comes from the POSTGRES_PASSWORD environment variable, never from this file.
# CATALOG_DB_URL lets you point at catalog_perf (1M products) without editing this file.
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5435/catalog_db}
spring.datasource.username=${POSTGRES_USER:auramart}
spring.datasource.password=${POSTGRES_PASSWORD}

# Step 3.15: connection pool. 20 connections per pod (system design), and fail after 3 s
# instead of the default 30 s, so an exhausted pool shows up as fast errors, not hung requests.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.pool-name=catalog-pool

# Step 0.9: Java 21 virtual threads for request handling. Threads become cheap,
# so the pool above (not the thread count) is now the real limit on concurrent DB work.
spring.threads.virtual.enabled=true

# Phase 4: Redis cache (infra/docker-compose.yml, no password in dev).
# Port 6380: the compose Redis is published there, because a native Windows Redis owns 127.0.0.1:6379.
# Short timeouts: if Redis is slow, give up fast and read the database (CacheConfig.errorHandler).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s

# Step 4.13: /actuator/metrics/cache.gets shows cache hits and misses.
management.endpoints.web.exposure.include=health,info,metrics

# Flyway creates the schema; Hibernate only checks that it matches the entities.
spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
# Close the DB session when the service method ends, not after the JSON is written.
# Lazy loading outside a transaction then fails loudly instead of firing hidden queries.
spring.jpa.open-in-view=false
