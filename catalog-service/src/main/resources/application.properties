spring.application.name=catalog-service
server.port=8082

# Database: the catalog_db created by infra/docker-compose.yml.
# The password comes from the POSTGRES_PASSWORD environment variable, never from this file.
spring.datasource.url=jdbc:postgresql://localhost:5435/catalog_db
spring.datasource.username=${POSTGRES_USER:auramart}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway creates the schema; Hibernate only checks that it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
