name: auramart

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:                                   # CHANGED — values come from infra/.env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # CHANGED — $$ = the container's shell reads the variable, not Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s        # check every 5 s
      timeout: 3s         # a check fails if it takes longer than 3 s
      retries: 10         # mark unhealthy after 10 failures in a row

  pgbouncer:                                       # connection pool in front of postgres
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: postgres                            # service name, not localhost
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction                       # hold a real connection for one transaction only
      MAX_CLIENT_CONN: 500                         # app connections accepted
      DEFAULT_POOL_SIZE: 20                        # real connections to postgres
      LISTEN_PORT: 6432
      ADMIN_USERS: ${POSTGRES_USER}                # allowed to run SHOW POOLS
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:                                          # orders, auth, payment
    image: mysql:8.4
    environment:                                   # CHANGED — values come from infra/.env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # CHANGED — CMD → CMD-SHELL so the shell can expand the variable
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:                                         # notification log
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:                                           # cache, cart, rate limits
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]   # save data to disk too
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mysql-data:
  mongo-data:
  redis-data:
